<!DOCTYPE html>
<html lang="th">
<head>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1A5276;
      --secondary: #2E86C1;
      --accent: #148F77;
      --light-blue: #D6EAF8;
      --gray-bg: #F2F3F4;
      --font-main: 'Sarabun', sans-serif;
      --font-heading: 'Prompt', sans-serif;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-hover: 0 6px 20px rgba(26,82,118,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-main); background: var(--gray-bg); color: #2C3E50; }

    /* ─── HEADER ─── */
    .header {
      background: var(--primary);
      padding: 0 24px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 8px;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
    }
    .logo-text { font-family: var(--font-heading); color: #fff; font-size: 16px; font-weight: 600; }
    .logo-sub { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 400; }
    .nav { display: flex; align-items: center; gap: 4px; }
    .nav a {
      color: rgba(255,255,255,0.85); text-decoration: none;
      padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
      transition: background .2s;
    }
    .nav a:hover, .nav a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .nav-auth { display: flex; align-items: center; gap: 8px; }
    .btn-login {
      background: rgba(255,255,255,0.15); color: #fff;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
      padding: 7px 18px; font-size: 14px; cursor: pointer;
      font-family: var(--font-main); text-decoration: none;
      transition: background .2s;
    }
    .btn-login:hover { background: rgba(255,255,255,0.25); }
    .user-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.1); border-radius: 8px;
      padding: 6px 14px; color: #fff; font-size: 13px;
    }
    .user-badge i { color: rgba(255,255,255,0.7); }

    /* ─── PAGE HEADER ─── */
    .page-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 40px 24px 32px;
      color: #fff;
    }
    .page-header-inner { max-width: 1280px; margin: 0 auto; }
    .page-title { font-family: var(--font-heading); font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .page-subtitle { color: rgba(255,255,255,0.8); font-size: 16px; }

    /* ─── SEARCH & FILTER BAR ─── */
    .filter-bar {
      background: #fff;
      border-bottom: 1px solid #E8ECF0;
      padding: 16px 24px;
      position: sticky; top: 64px; z-index: 90;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .filter-inner { max-width: 1280px; margin: 0 auto; }
    .search-row {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 240px;
      display: flex; align-items: center;
      background: var(--gray-bg); border-radius: 10px; padding: 0 14px;
      border: 2px solid transparent; transition: border .2s;
    }
    .search-box:focus-within { border-color: var(--secondary); background: #fff; }
    .search-box i { color: #95A5A6; margin-right: 8px; font-size: 14px; }
    .search-box input {
      border: none; background: transparent; font-family: var(--font-main);
      font-size: 14px; padding: 10px 0; outline: none; width: 100%; color: #2C3E50;
    }
    .filter-select {
      border: 2px solid #E8ECF0; border-radius: 10px; padding: 9px 14px;
      font-family: var(--font-main); font-size: 14px; color: #2C3E50;
      background: #fff; cursor: pointer; outline: none; transition: border .2s;
    }
    .filter-select:focus { border-color: var(--secondary); }
    .btn-search {
      background: var(--secondary); color: #fff; border: none;
      border-radius: 10px; padding: 10px 22px; font-family: var(--font-main);
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-search:hover { background: var(--primary); }
    .btn-reset {
      background: transparent; color: #7F8C8D; border: 2px solid #E8ECF0;
      border-radius: 10px; padding: 9px 16px; font-family: var(--font-main);
      font-size: 13px; cursor: pointer; transition: all .2s;
    }
    .btn-reset:hover { border-color: #BDC3C7; color: #2C3E50; }

    /* Filter chips */
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--gray-bg); border: 2px solid #E8ECF0;
      border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer;
      transition: all .2s; color: #555; font-family: var(--font-main);
    }
    .chip:hover { border-color: var(--secondary); color: var(--secondary); }
    .chip.active { background: var(--light-blue); border-color: var(--secondary); color: var(--primary); font-weight: 600; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }

    /* ─── MAIN CONTENT ─── */
    .content { max-width: 1280px; margin: 0 auto; padding: 24px; }

    /* Result info */
    .result-info {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: gap;
    }
    .result-count { font-size: 14px; color: #7F8C8D; }
    .result-count strong { color: var(--primary); }
    .view-toggle { display: flex; gap: 4px; }
    .toggle-btn {
      background: #fff; border: 1px solid #E0E0E0; border-radius: 8px;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #95A5A6; transition: all .2s;
    }
    .toggle-btn:hover, .toggle-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ─── CARD GRID ─── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card-grid.list-view { grid-template-columns: 1fr; }

    .inno-card {
      background: #fff; border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
      transition: transform .2s, box-shadow .2s;
      cursor: pointer; display: flex; flex-direction: column;
    }
    .inno-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

    .card-header-band {
      height: 6px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    .card-icon-row {
      padding: 20px 20px 0;
      display: flex; align-items: center; gap: 12px;
    }
    .type-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--light-blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .card-type-label { font-size: 12px; color: var(--secondary); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .card-dept { font-size: 12px; color: #95A5A6; margin-top: 2px; }

    .card-body { padding: 12px 20px 16px; flex: 1; }
    .card-title {
      font-family: var(--font-heading); font-size: 15px; font-weight: 600;
      color: #1A252F; line-height: 1.4; margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .meta-chip {
      background: var(--gray-bg); border-radius: 6px;
      padding: 3px 8px; font-size: 11px; color: #7F8C8D;
      display: flex; align-items: center; gap: 4px;
    }
    .meta-chip i { font-size: 10px; }
    .card-desc {
      font-size: 13px; color: #7F8C8D; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
    .tag {
      background: var(--light-blue); color: var(--primary);
      border-radius: 4px; padding: 2px 8px; font-size: 11px;
    }
    .card-footer {
      padding: 12px 20px;
      border-top: 1px solid #F0F3F4;
      display: flex; align-items: center; justify-content: space-between;
    }
    .teacher-name { font-size: 12px; color: #7F8C8D; display: flex; align-items: center; gap: 5px; }
    .card-stats { display: flex; gap: 12px; }
    .stat { font-size: 12px; color: #95A5A6; display: flex; align-items: center; gap: 4px; }
    .stat i { font-size: 11px; }

    /* List view card */
    .card-grid.list-view .inno-card {
      flex-direction: row;
    }
    .card-grid.list-view .card-header-band {
      width: 6px; height: auto;
      background: linear-gradient(180deg, var(--primary), var(--secondary));
    }
    .card-grid.list-view .card-icon-row { padding: 20px; }
    .card-grid.list-view .card-body { padding: 16px 16px 16px 0; }
    .card-grid.list-view .card-title { -webkit-line-clamp: 1; }
    .card-grid.list-view .card-footer { border-top: none; padding: 16px; align-self: center; flex-direction: column; gap: 8px; min-width: 140px; }

    /* Skeleton */
    .skeleton { animation: shimmer 1.5s infinite; }
    .skeleton-card {
      background: #fff; border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px; height: 240px;
    }
    .skeleton-line { background: #E8ECF0; border-radius: 4px; margin-bottom: 10px; }
    @keyframes shimmer {
      0%, 100% { opacity: 1; } 50% { opacity: 0.5; }
    }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center; padding: 80px 24px;
      grid-column: 1 / -1;
    }
    .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: .4; }
    .empty-title { font-family: var(--font-heading); font-size: 20px; color: #7F8C8D; margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: #BDC3C7; }

    /* ─── PAGINATION ─── */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; margin-top: 36px; flex-wrap: wrap;
    }
    .page-btn {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid #E0E0E0;
      background: #fff; cursor: pointer; font-family: var(--font-main);
      font-size: 14px; color: #2C3E50; transition: all .2s;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { background: var(--light-blue); border-color: var(--secondary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
    .page-btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
    .page-info { font-size: 13px; color: #95A5A6; margin: 0 8px; }

    /* ─── BACK TO TOP ─── */
    .back-top {
      position: fixed; bottom: 28px; right: 28px; z-index: 200;
      width: 44px; height: 44px; background: var(--primary); color: #fff;
      border-radius: 50%; display: none; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 12px rgba(26,82,118,0.35);
      transition: background .2s; font-size: 16px;
    }
    .back-top:hover { background: var(--secondary); }
    .back-top.show { display: flex; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .nav a:not(:first-child) { display: none; }
      .page-title { font-size: 22px; }
      .search-row { flex-direction: column; }
      .search-box { min-width: 100%; }
      .filter-select { width: 100%; }
      .btn-search, .btn-reset { width: 100%; justify-content: center; }
      .content { padding: 16px; }
      .card-grid { grid-template-columns: 1fr; }
      .result-info { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>

<script>
  // ── EXEC_URL ถูก inject โดย Code.gs ตอน serve ──────────
  var EXEC_URL = "";  // placeholder — Code.gs จะแทนค่าจริง

  function getExecUrl() { return EXEC_URL || window.location.href.split('?')[0]; }
  function goTo(page) {
    var token = sessionStorage.getItem('KIMS_TOKEN') || '';
    var url = getExecUrl() + '?page=' + page;
    if (token) url += '&_kt=' + encodeURIComponent(token);
    window.open(url, '_top');
  }
  (function() {
    try { var p = new URLSearchParams(window.location.search); var t = p.get('_kt'); if (t) { sessionStorage.setItem('KIMS_TOKEN', t); p.delete('_kt'); if (history.replaceState) history.replaceState(null, '', '?' + p.toString()); } } catch(e) {}
    document.addEventListener('click', function(ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href*="?page="]') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      var i = href.indexOf('?page='); if (i === -1) return;
      ev.preventDefault();
      var tok = sessionStorage.getItem('KIMS_TOKEN') || '';
      var url = getExecUrl() + href.substring(i);
      if (tok && url.indexOf('_kt=') === -1) url += '&_kt=' + encodeURIComponent(tok);
      window.open(url, a.getAttribute('target') === '_blank' ? '_blank' : '_top');
    });
  })();
  function getToken() { return sessionStorage.getItem('KIMS_TOKEN') || ''; }

  function callAPI(action, params) {
    var payload = Object.assign({ action: action, token: getToken() }, params || {});
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .handleRequest(payload);
    });
  }

const TYPE_ICONS = {'01':'🖥️','02':'🔬','03':'📋','04':'📝','05':'⚙️','99':'💡'};
const TYPE_COLORS = {'01':'#1A5276','02':'#2E86C1','03':'#148F77','04':'#F39C12','05':'#8E44AD','99':'#85929E'};
const TYPE_NAMES = {'01':'สื่อการสอน/CAI','02':'วิจัยในชั้นเรียน','03':'แผนการจัดการเรียนรู้','04':'ชุดกิจกรรม/ใบงาน','05':'เทคโนโลยีทางการศึกษา','99':'อื่นๆ'};

  checkAuth();
  loadCards();
  window.addEventListener('scroll', () => {
    document.getElementById('backTop').classList.toggle('show', window.scrollY > 300);
  });
  // URL params
  const params = new URLSearchParams(window.location.search);
  if (params.get('search')) {
    document.getElementById('searchInput').value = params.get('search');
    currentFilters.search = params.get('search');
  }
  if (params.get('type')) {
    currentFilters.type = params.get('type');
    setTypeChip(params.get('type'), false);
  }
});

function fillYears() {
  const sel = document.getElementById('filterYear');
  const y = new Date().getFullYear() + 543;
  for (let i = 0; i <= 5; i++) {
    const opt = document.createElement('option');
    opt.value = y - i;
    opt.textContent = 'ปีการศึกษา ' + (y - i);
    sel.appendChild(opt);
  }
}

async function checkAuth() {
  try {
    const res = await callAPI('getCurrentUser', {});
    if (res.success) {
      const u = res.data;
      const isAdmin = ['SUPERADMIN','ADMIN','HEAD'].includes(u.role);
      document.getElementById('navAuth').innerHTML = `
        <div class="user-badge">
          <i class="fas fa-user-circle"></i>
          <span>${escHtml(u.full_name)}</span>
        </div>
        ${isAdmin ? `<a href="?page=admin-dashboard" class="btn-login" style="margin-left:4px"><i class="fas fa-chart-pie"></i> แดชบอร์ด</a>` : `<a href="?page=my-innovations" class="btn-login" style="margin-left:4px"><i class="fas fa-folder"></i> นวัตกรรมของฉัน</a>`}
        <button class="btn-login" onclick="logout()" style="border-color:rgba(255,255,255,0.3)"><i class="fas fa-sign-out-alt"></i></button>
      `;
    }
  } catch(e) {}
}

async function loadCards(page) {
  page = page || currentPage;
  currentPage = page;
  showSkeleton();
  try {
    const params = {
      page: page,
      limit: 12,
      search: currentFilters.search,
      type: currentFilters.type,
      dept: currentFilters.dept,
      year: currentFilters.year,
    };
    const res = await callAPI('getInnovations', params);
    if (res.success) {
      renderCards(res.data.items || []);
      totalPages = res.data.totalPages || 1;
      const total = res.data.total || 0;
      document.getElementById('resultCount').innerHTML = `พบ <strong>${total.toLocaleString()}</strong> รายการ`;
      renderPagination(page, totalPages);
    } else {
      showError(res.error);
    }
  } catch(e) {
    showError('เกิดข้อผิดพลาด กรุณาลองใหม่');
  }
}

function showSkeleton() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    grid.innerHTML += `<div class="skeleton-card skeleton">
      <div class="skeleton-line" style="height:48px;width:48px;border-radius:12px"></div>
      <div class="skeleton-line" style="height:18px;width:80%;margin-top:14px"></div>
      <div class="skeleton-line" style="height:14px;width:60%"></div>
      <div class="skeleton-line" style="height:12px;width:90%;margin-top:10px"></div>
      <div class="skeleton-line" style="height:12px;width:70%"></div>
    </div>`;
  }
}

function renderCards(items) {
  const grid = document.getElementById('cardGrid');
  grid.className = 'card-grid' + (currentView === 'list' ? ' list-view' : '');
  if (!items || items.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">ไม่พบนวัตกรรม</div>
      <div class="empty-sub">ลองเปลี่ยนคำค้นหาหรือตัวกรองใหม่</div>
    </div>`;
    return;
  }
  grid.innerHTML = items.map(item => {
    const icon = TYPE_ICONS[item.type_code] || '💡';
    const typeName = TYPE_NAMES[item.type_code] || 'อื่นๆ';
    const color = TYPE_COLORS[item.type_code] || '#85929E';
    const grades = tryParseArr(item.grade_level).join(', ');
    const tags = tryParseArr(item.tags).slice(0, 3);
    return `<div class="inno-card" onclick="viewDetail('${escHtml(item.innovation_id)}')">
      <div class="card-header-band"></div>
      <div class="card-icon-row">
        <div class="type-icon" style="background:${color}22">${icon}</div>
        <div>
          <div class="card-type-label" style="color:${color}">${typeName}</div>
          <div class="card-dept">${escHtml(item.department || '')}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(item.title)}</div>
        <div class="card-meta">
          ${grades ? `<span class="meta-chip"><i class="fas fa-users"></i>${grades}</span>` : ''}
          <span class="meta-chip"><i class="fas fa-calendar"></i>ปี ${item.academic_year || '-'}</span>
          ${item.semester ? `<span class="meta-chip"><i class="fas fa-clock"></i>ภาค ${item.semester}</span>` : ''}
        </div>
        ${item.description ? `<div class="card-desc">${escHtml(item.description)}</div>` : ''}
        ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="card-footer">
        <div class="teacher-name"><i class="fas fa-chalkboard-teacher"></i>${escHtml(item.teacher_name || '-')}</div>
        <div class="card-stats">
          <span class="stat"><i class="fas fa-eye"></i>${(item.view_count||0).toLocaleString()}</span>
          ${item.file_urls && tryParseArr(item.file_urls).length > 0 ? `<span class="stat"><i class="fas fa-paperclip"></i>${tryParseArr(item.file_urls).length}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderPagination(current, total) {
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="loadCards(${current-1})" ${current<=1?'disabled':''}><i class="fas fa-chevron-left"></i></button>`;
  const start = Math.max(1, current - 2);
  const end = Math.min(total, current + 2);
  if (start > 1) html += `<button class="page-btn" onclick="loadCards(1)">1</button>${start>2?'<span class="page-info">…</span>':''}`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn${i===current?' active':''}" onclick="loadCards(${i})">${i}</button>`;
  }
  if (end < total) html += `${end<total-1?'<span class="page-info">…</span>':''}<button class="page-btn" onclick="loadCards(${total})">${total}</button>`;
  html += `<button class="page-btn" onclick="loadCards(${current+1})" ${current>=total?'disabled':''}><i class="fas fa-chevron-right"></i></button>`;
  html += `<span class="page-info">หน้า ${current} / ${total}</span>`;
  pg.innerHTML = html;
}

function doSearch() {
  currentFilters.search = document.getElementById('searchInput').value.trim();
  currentFilters.type = document.getElementById('filterType').value;
  currentFilters.dept = document.getElementById('filterDept').value;
  currentFilters.year = document.getElementById('filterYear').value;
  currentPage = 1;
  loadCards(1);
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterType').value = '';
  document.getElementById('filterDept').value = '';
  document.getElementById('filterYear').value = '';
  currentFilters = { search: '', type: '', dept: '', year: '' };
  setTypeChip('', false);
  loadCards(1);
}

function setTypeChip(type, search = true) {
  document.querySelectorAll('#typeChips .chip').forEach(c => {
    c.classList.toggle('active', c.dataset.type === type);
  });
  currentFilters.type = type;
  document.getElementById('filterType').value = type;
  if (search) { currentPage = 1; loadCards(1); }
}

function setView(view) {
  currentView = view;
  document.getElementById('gridBtn').classList.toggle('active', view === 'grid');
  document.getElementById('listBtn').classList.toggle('active', view === 'list');
  const grid = document.getElementById('cardGrid');
  grid.className = 'card-grid' + (view === 'list' ? ' list-view' : '');
}

function viewDetail(id) {
  goTo('detail&id=') + encodeURIComponent(id);
}

async function logout() {
  await callAPI('logout', {});
  window.location.reload();
}

function showError(msg) {
  document.getElementById('cardGrid').innerHTML = `<div class="empty-state">
    <div class="empty-icon">⚠️</div>
    <div class="empty-title">เกิดข้อผิดพลาด</div>
    <div class="empty-sub">${escHtml(msg || 'กรุณาลองใหม่อีกครั้ง')}</div>
  </div>`;
  document.getElementById('resultCount').textContent = '';
}

function tryParseArr(val) {
  if (Array.isArray(val)) return val;
  try { const p = JSON.parse(val); return Array.isArray(p) ? p : []; } catch(e) { return []; }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>

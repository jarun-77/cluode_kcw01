<!DOCTYPE html>
<html lang="th">
<head>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #1A5276; --secondary: #2E86C1; --accent: #148F77;
      --light-blue: #D6EAF8; --gray-bg: #F2F3F4;
      --font-main: 'Sarabun', sans-serif; --font-heading: 'Prompt', sans-serif;
      --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-main); background: var(--gray-bg); color: #2C3E50; display: flex; }

    /* SIDEBAR */
    .sidebar { width: 240px; background: var(--primary); min-height: 100vh; flex-shrink: 0; position: fixed; top: 0; left: 0; z-index: 100; display: flex; flex-direction: column; }
    .sb-logo { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sb-logo-text { font-family: var(--font-heading); color: #fff; font-size: 18px; font-weight: 700; }
    .sb-logo-sub { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }
    .sb-user { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sb-user-name { font-size: 13px; color: #fff; font-weight: 600; }
    .sb-user-role { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .sb-nav { flex: 1; padding: 10px 0; }
    .sb-nav a { display: flex; align-items: center; gap: 10px; padding: 11px 20px; color: rgba(255,255,255,0.75); text-decoration: none; font-size: 14px; transition: all .2s; }
    .sb-nav a:hover, .sb-nav a.active { background: rgba(255,255,255,0.12); color: #fff; }
    .sb-nav a.active { border-right: 3px solid #fff; }
    .sb-nav .badge { background: #E74C3C; color: #fff; border-radius: 10px; padding: 2px 7px; font-size: 11px; font-weight: 700; margin-left: auto; }
    .sb-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    .sb-footer a { color: rgba(255,255,255,0.5); font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .sb-footer a:hover { color: #fff; }

    /* MAIN */
    .main-wrapper { margin-left: 240px; flex: 1; min-height: 100vh; }
    .topbar { background: #fff; padding: 0 28px; height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E8ECF0; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .page-heading { font-family: var(--font-heading); font-size: 18px; font-weight: 700; color: var(--primary); }

    .content { padding: 24px 28px; }

    /* TABS */
    .tab-bar { display: flex; gap: 4px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; margin-bottom: 24px; overflow-x: auto; }
    .tab-btn { padding: 9px 20px; border-radius: 8px; border: none; background: transparent; font-family: var(--font-main); font-size: 14px; color: #7F8C8D; cursor: pointer; transition: all .2s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .tab-btn:hover { background: var(--gray-bg); color: #2C3E50; }
    .tab-btn.active { background: var(--primary); color: #fff; font-weight: 600; }

    /* Year Filter */
    .year-filter { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .year-filter label { font-size: 14px; color: #7F8C8D; }
    .sel { border: 2px solid #E8ECF0; border-radius: 10px; padding: 9px 14px; font-family: var(--font-main); font-size: 14px; background: #fff; cursor: pointer; outline: none; box-shadow: var(--shadow); }
    .sel:focus { border-color: var(--secondary); }
    .btn-load { background: var(--secondary); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-family: var(--font-main); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-load:hover { background: var(--primary); }

    /* Tabs Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Charts */
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .chart-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
    .chart-title { font-family: var(--font-heading); font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 260px; }

    /* Table */
    .table-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; }
    .table-head { padding: 16px 20px; border-bottom: 1px solid #F0F3F4; display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-family: var(--font-heading); font-size: 15px; font-weight: 600; color: var(--primary); }
    table { width: 100%; border-collapse: collapse; }
    th { background: #F8FAFB; padding: 11px 16px; text-align: left; font-size: 12px; font-weight: 600; color: #7F8C8D; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #E8ECF0; }
    td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #F5F7F8; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FAFBFC; }

    /* Rank */
    .rank-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 700; }
    .rank-1 { background: #FFD700; color: #6B4A00; }
    .rank-2 { background: #C0C0C0; color: #555; }
    .rank-3 { background: #CD7F32; color: #fff; }
    .rank-n { background: var(--gray-bg); color: #7F8C8D; }

    /* Audit Log */
    .log-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F5F7F8; align-items: flex-start; }
    .log-row:last-child { border-bottom: none; }
    .log-action-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .log-LOGIN { background: #E8F8F5; color: #148F77; }
    .log-LOGOUT { background: #F2F3F4; color: #95A5A6; }
    .log-CREATE { background: #D6EAF8; color: #2E86C1; }
    .log-APPROVE { background: #E8F8F5; color: #148F77; }
    .log-REJECT { background: #FDEDEC; color: #C0392B; }
    .log-UPDATE { background: #FEF9E7; color: #E67E22; }
    .log-DELETE { background: #FDEDEC; color: #C0392B; }
    .log-VIEW { background: #F9F0FF; color: #8E44AD; }
    .log-detail { flex: 1; }
    .log-user { font-size: 13px; font-weight: 600; }
    .log-desc { font-size: 12px; color: #95A5A6; margin-top: 2px; }
    .log-time { font-size: 12px; color: #BDC3C7; flex-shrink: 0; }

    /* Empty */
    .empty-msg { text-align: center; padding: 48px; color: #BDC3C7; font-size: 15px; }

    .loading-msg { text-align: center; padding: 40px; color: #7F8C8D; }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .main-wrapper { margin-left: 0; }
      .chart-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-text"><i class="fas fa-lightbulb" style="margin-right:6px"></i>KIMS</div>
    <div class="sb-logo-sub">โรงเรียนกระแชงวิทยา</div>
  </div>
  <div class="sb-user">
    <div class="sb-user-name" id="sbUserName">กำลังโหลด...</div>
    <div class="sb-user-role" id="sbUserRole"></div>
  </div>
  <nav class="sb-nav">
    <a href="?page=admin-dashboard"><i class="fas fa-chart-pie fa-fw"></i>แดชบอร์ด</a>
    <a href="?page=admin-approve"><i class="fas fa-check-square fa-fw"></i>อนุมัตินวัตกรรม <span class="badge" id="sbBadge" style="display:none">0</span></a>
    <a href="?page=innovations"><i class="fas fa-archive fa-fw"></i>คลังนวัตกรรม</a>
    <a href="?page=admin-users"><i class="fas fa-users fa-fw"></i>จัดการผู้ใช้</a>
    <a href="?page=admin-reports" class="active"><i class="fas fa-file-chart-bar fa-fw"></i>รายงาน</a>
    <div id="superAdminNav" style="display:none">
      <a href="?page=admin-config"><i class="fas fa-cog fa-fw"></i>ตั้งค่าระบบ</a>
    </div>
  </nav>
  <div class="sb-footer">
    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i>ออกจากระบบ</a>
  </div>
</div>

<!-- MAIN -->
<div class="main-wrapper">
  <div class="topbar">
    <div class="page-heading"><i class="fas fa-file-chart-bar" style="margin-right:8px;color:var(--secondary)"></i>รายงานและสถิติ</div>
  </div>
  <div class="content">
    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('yearly')"><i class="fas fa-calendar-alt"></i>รายปีการศึกษา</button>
      <button class="tab-btn" onclick="switchTab('teacher')"><i class="fas fa-chalkboard-teacher"></i>รายครูผู้สอน</button>
      <button class="tab-btn" onclick="switchTab('dept')"><i class="fas fa-book"></i>รายกลุ่มสาระ</button>
      <button class="tab-btn" onclick="switchTab('audit')"><i class="fas fa-shield-alt"></i>บันทึกกิจกรรม</button>
    </div>

    <!-- ── YEARLY TAB ── -->
    <div class="tab-content active" id="tab-yearly">
      <div class="year-filter">
        <label><i class="fas fa-filter"></i> ปีการศึกษา:</label>
        <select class="sel" id="yearSel"></select>
        <button class="btn-load" onclick="loadYearlyReport()"><i class="fas fa-sync"></i>โหลดรายงาน</button>
      </div>
      <div id="yearlyContent"><div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div></div>
    </div>

    <!-- ── TEACHER TAB ── -->
    <div class="tab-content" id="tab-teacher">
      <div class="year-filter">
        <label><i class="fas fa-filter"></i> ปีการศึกษา:</label>
        <select class="sel" id="teacherYearSel"></select>
        <button class="btn-load" onclick="loadTeacherReport()"><i class="fas fa-sync"></i>โหลดรายงาน</button>
      </div>
      <div id="teacherContent"><div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div></div>
    </div>

    <!-- ── DEPT TAB ── -->
    <div class="tab-content" id="tab-dept">
      <div id="deptContent"><div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div></div>
    </div>

    <!-- ── AUDIT TAB ── -->
    <div class="tab-content" id="tab-audit">
      <div class="table-card">
        <div class="table-head">
          <div class="section-title"><i class="fas fa-shield-alt"></i> บันทึกกิจกรรมในระบบ</div>
        </div>
        <div id="auditContent" style="padding:20px">
          <div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── EXEC_URL ถูก inject โดย Code.gs ตอน serve ──────────
  var EXEC_URL = "";  // placeholder — Code.gs จะแทนค่าจริง

  function getExecUrl() { return EXEC_URL || window.location.href.split('?')[0]; }
  function goTo(page) {
    var token = sessionStorage.getItem('KIMS_TOKEN') || '';
    var url = getExecUrl() + '?page=' + page;
    if (token) url += '&_kt=' + encodeURIComponent(token);
    window.open(url, '_top');
  }
  (function() {
    try { var p = new URLSearchParams(window.location.search); var t = p.get('_kt'); if (t) { sessionStorage.setItem('KIMS_TOKEN', t); p.delete('_kt'); if (history.replaceState) history.replaceState(null, '', '?' + p.toString()); } } catch(e) {}
    document.addEventListener('click', function(ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href*="?page="]') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      var i = href.indexOf('?page='); if (i === -1) return;
      ev.preventDefault();
      var tok = sessionStorage.getItem('KIMS_TOKEN') || '';
      var url = getExecUrl() + href.substring(i);
      if (tok && url.indexOf('_kt=') === -1) url += '&_kt=' + encodeURIComponent(tok);
      window.open(url, a.getAttribute('target') === '_blank' ? '_blank' : '_top');
    });
  })();
  function getToken() { return sessionStorage.getItem('KIMS_TOKEN') || ''; }

  function callAPI(action, params) {
    var payload = Object.assign({ action: action, token: getToken() }, params || {});
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .handleRequest(payload);
    });
  }

let chartYearType, chartYearDept, chartDept, chartTeacher;
const CHART_COLORS = ['#1A5276','#2E86C1','#148F77','#F39C12','#8E44AD','#E74C3C','#16A085','#D35400','#7F8C8D','#2C3E50'];


window.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await callAPI('getCurrentUser', {});
    if (!res.success) { sessionStorage.removeItem('KIMS_TOKEN'); sessionStorage.removeItem('KIMS_USER'); goTo('login'); return; }
    const u = res.data;
    if (!['SUPERADMIN','ADMIN','HEAD'].includes(u.role)) { goTo('index'); return; }
    document.getElementById('sbUserName').textContent = u.full_name;
    document.getElementById('sbUserRole').textContent = u.role === 'SUPERADMIN' ? 'ผู้ดูแลสูงสุด' : u.role === 'ADMIN' ? 'ผู้ดูแลระบบ' : 'หัวหน้ากลุ่มสาระ';
    if (u.role === 'SUPERADMIN') document.getElementById('superAdminNav').style.display = 'block';
    fillYears();
    await loadYearlyReport();
    loadPendingCount();
  } catch(e) { sessionStorage.removeItem('KIMS_TOKEN'); sessionStorage.removeItem('KIMS_USER'); goTo('login'); }
});

function fillYears() {
  const y = new Date().getFullYear() + 543;
  ['yearSel','teacherYearSel'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    for (let i = 0; i <= 4; i++) {
      const opt = document.createElement('option');
      opt.value = y - i; opt.textContent = `ปีการศึกษา ${y - i}`;
      sel.appendChild(opt);
    }
  });
}

async function loadPendingCount() {
  try {
    const res = await callAPI('getPendingList', {});
    if (res.success && res.data && res.data.length > 0) {
      const b = document.getElementById('sbBadge');
      b.style.display = ''; b.textContent = res.data.length;
    }
  } catch(e) {}
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['yearly','teacher','dept','audit'][i] === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'dept') loadDeptReport();
  if (tab === 'audit') loadAuditLog();
}

async function loadYearlyReport() {
  const year = document.getElementById('yearSel').value;
  document.getElementById('yearlyContent').innerHTML = '<div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>';
  try {
    const res = await callAPI('getYearlyReport', { academic_year: year });
    if (!res.success) { document.getElementById('yearlyContent').innerHTML = `<div class="empty-msg">เกิดข้อผิดพลาด: ${escHtml(res.error)}</div>`; return; }
    const d = res.data || {};
    document.getElementById('yearlyContent').innerHTML = `
      <div class="chart-grid">
        <div class="chart-card"><div class="chart-title">จำนวนตามประเภทนวัตกรรม</div><div class="chart-wrap"><canvas id="chartYearType"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">จำนวนตามกลุ่มสาระ</div><div class="chart-wrap"><canvas id="chartYearDept"></canvas></div></div>
      </div>
      <div class="table-card">
        <div class="table-head"><div class="section-title">สรุปปีการศึกษา ${escHtml(String(year))}</div></div>
        <table>
          <thead><tr><th>#</th><th>รายการ</th><th>ค่า</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>นวัตกรรมทั้งหมด</td><td><strong>${d.total||0}</strong></td></tr>
            <tr><td>2</td><td>เผยแพร่</td><td><strong style="color:var(--accent)">${d.published||0}</strong></td></tr>
            <tr><td>3</td><td>รออนุมัติ</td><td><strong style="color:#E67E22">${d.pending||0}</strong></td></tr>
            <tr><td>4</td><td>ครูที่มีนวัตกรรม</td><td><strong>${d.active_teachers||0}</strong></td></tr>
          </tbody>
        </table>
      </div>`;

    const typeLabels = Object.keys(d.by_type || {});
    const typeData = Object.values(d.by_type || {});
    if (chartYearType) chartYearType.destroy();
    chartYearType = new Chart(document.getElementById('chartYearType'), {
      type: 'doughnut',
      data: { labels: typeLabels, datasets: [{ data: typeData, backgroundColor: CHART_COLORS }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { font: { family: 'Sarabun', size: 12 } } } } }
    });

    const deptLabels = Object.keys(d.by_dept || {});
    const deptData = Object.values(d.by_dept || {});
    if (chartYearDept) chartYearDept.destroy();
    chartYearDept = new Chart(document.getElementById('chartYearDept'), {
      type: 'bar',
      data: { labels: deptLabels, datasets: [{ label: 'นวัตกรรม', data: deptData, backgroundColor: '#2E86C1' }] },
      options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { family: 'Sarabun' } } }, y: { ticks: { font: { family: 'Sarabun', size: 11 } } } } }
    });
  } catch(e) { document.getElementById('yearlyContent').innerHTML = `<div class="empty-msg">เกิดข้อผิดพลาด</div>`; }
}

async function loadTeacherReport() {
  const year = document.getElementById('teacherYearSel').value;
  document.getElementById('teacherContent').innerHTML = '<div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>';
  try {
    const res = await callAPI('getTeacherReport', { academic_year: year });
    if (!res.success) { document.getElementById('teacherContent').innerHTML = `<div class="empty-msg">เกิดข้อผิดพลาด</div>`; return; }
    const teachers = res.data || [];
    if (!teachers.length) { document.getElementById('teacherContent').innerHTML = `<div class="empty-msg">ไม่พบข้อมูล</div>`; return; }

    const rows = teachers.slice(0, 30).map((t, i) => `<tr>
      <td><span class="rank-num ${i<3?`rank-${i+1}`:'rank-n'}">${i+1}</span></td>
      <td><strong>${escHtml(t.teacher_name||'-')}</strong><div style="font-size:12px;color:#7F8C8D">${escHtml(t.department||'-')}</div></td>
      <td style="text-align:center"><strong>${t.total||0}</strong></td>
      <td style="text-align:center;color:var(--accent)"><strong>${t.published||0}</strong></td>
      <td style="text-align:center;color:#E67E22"><strong>${t.pending||0}</strong></td>
      <td style="text-align:center;color:#7F8C8D"><strong>${(t.view_count||0).toLocaleString()}</strong></td>
    </tr>`).join('');

    document.getElementById('teacherContent').innerHTML = `
      <div class="table-card">
        <div class="table-head"><div class="section-title">ครูผู้มีนวัตกรรมในปี ${escHtml(String(year))}</div></div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>#</th><th>ครูผู้สอน</th><th style="text-align:center">ทั้งหมด</th><th style="text-align:center">เผยแพร่</th><th style="text-align:center">รออนุมัติ</th><th style="text-align:center">ยอดเข้าชม</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  } catch(e) { document.getElementById('teacherContent').innerHTML = `<div class="empty-msg">เกิดข้อผิดพลาด</div>`; }
}

async function loadDeptReport() {
  document.getElementById('deptContent').innerHTML = '<div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>';
  try {
    const res = await callAPI('getDashboardData', {});
    if (!res.success) { document.getElementById('deptContent').innerHTML = '<div class="empty-msg">เกิดข้อผิดพลาด</div>'; return; }
    const d = res.data || {};
    const byDept = d.by_dept || {};
    const labels = Object.keys(byDept);
    const data = Object.values(byDept);

    document.getElementById('deptContent').innerHTML = `
      <div class="chart-card" style="margin-bottom:20px">
        <div class="chart-title">สัดส่วนนวัตกรรมตามกลุ่มสาระ</div>
        <div class="chart-wrap"><canvas id="chartDept"></canvas></div>
      </div>
      <div class="table-card">
        <div class="table-head"><div class="section-title">สรุปตามกลุ่มสาระการเรียนรู้</div></div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>#</th><th>กลุ่มสาระ</th><th>จำนวนนวัตกรรม</th><th>%</th></tr></thead>
            <tbody>
              ${labels.map((l,i)=>{
                const total = data.reduce((a,b)=>a+b,0)||1;
                return `<tr>
                  <td><span class="rank-num ${i<3?`rank-${i+1}`:'rank-n'}">${i+1}</span></td>
                  <td>${escHtml(l)}</td>
                  <td><strong>${data[i]}</strong></td>
                  <td>${((data[i]/total)*100).toFixed(1)}%</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;

    if (chartDept) chartDept.destroy();
    chartDept = new Chart(document.getElementById('chartDept'), {
      type: 'bar',
      data: { labels, datasets: [{ label: 'นวัตกรรม', data, backgroundColor: CHART_COLORS }] },
      options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { family: 'Sarabun' } } }, y: { ticks: { font: { family: 'Sarabun', size: 12 } } } } }
    });
  } catch(e) { document.getElementById('deptContent').innerHTML = '<div class="empty-msg">เกิดข้อผิดพลาด</div>'; }
}

async function loadAuditLog() {
  document.getElementById('auditContent').innerHTML = '<div class="loading-msg"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>';
  try {
    const res = await callAPI('getAuditLog', { limit: 100 });
    if (!res.success) { document.getElementById('auditContent').innerHTML = '<div class="empty-msg">เกิดข้อผิดพลาด</div>'; return; }
    const logs = res.data || [];
    if (!logs.length) { document.getElementById('auditContent').innerHTML = '<div class="empty-msg">ไม่มีบันทึกกิจกรรม</div>'; return; }
    document.getElementById('auditContent').innerHTML = logs.map(l => `
      <div class="log-row">
        <span class="log-action-badge log-${l.action}">${l.action}</span>
        <div class="log-detail">
          <div class="log-user">${escHtml(l.user_id||'GUEST')}</div>
          <div class="log-desc">${escHtml(l.target_type||'')} ${l.target_id ? `(${escHtml(l.target_id)})` : ''} ${l.detail ? '— ' + escHtml(typeof l.detail === 'string' ? l.detail.substring(0,80) : '') : ''}</div>
        </div>
        <span class="log-time">${escHtml(l.timestamp ? l.timestamp.replace('T',' ').substring(0,16) : '-')}</span>
      </div>`).join('');
  } catch(e) { document.getElementById('auditContent').innerHTML = '<div class="empty-msg">เกิดข้อผิดพลาด</div>'; }
}

async function logout() {
  await callAPI('logout', {});
  sessionStorage.removeItem('KIMS_TOKEN'); sessionStorage.removeItem('KIMS_USER'); goTo('login');
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

<!DOCTYPE html>
<html lang="th">
<head>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1A5276; --secondary: #2E86C1; --accent: #148F77;
      --light-blue: #D6EAF8; --gray-bg: #F2F3F4;
      --font-main: 'Sarabun', sans-serif; --font-heading: 'Prompt', sans-serif;
      --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-main); background: var(--gray-bg); color: #2C3E50; }

    /* HEADER */
    .header { background: var(--primary); padding: 0 24px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 38px; height: 38px; border-radius: 8px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
    .logo-text { font-family: var(--font-heading); color: #fff; font-size: 16px; font-weight: 600; }
    .logo-sub { font-size: 11px; color: rgba(255,255,255,0.7); }
    .nav-auth { display: flex; align-items: center; gap: 8px; }
    .user-badge { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 14px; color: #fff; font-size: 13px; }
    .btn-sm { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: var(--font-main); text-decoration: none; transition: background .2s; }
    .btn-sm:hover { background: rgba(255,255,255,0.25); }

    /* MAIN */
    .main { max-width: 1280px; margin: 0 auto; padding: 28px 24px; }

    /* PAGE TITLE */
    .page-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-family: var(--font-heading); font-size: 24px; font-weight: 700; color: var(--primary); }
    .page-title span { font-size: 14px; color: #7F8C8D; font-weight: 400; font-family: var(--font-main); margin-left: 8px; }
    .btn-upload { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 11px 22px; font-family: var(--font-main); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: background .2s; }
    .btn-upload:hover { background: #0e7360; }

    /* STATS ROW */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
    .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .stat-info { flex: 1; }
    .stat-num { font-family: var(--font-heading); font-size: 24px; font-weight: 700; }
    .stat-lbl { font-size: 12px; color: #7F8C8D; margin-top: 2px; }

    /* FILTER BAR */
    .filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; display: flex; align-items: center; background: #fff; border-radius: 10px; padding: 0 14px; border: 2px solid #E8ECF0; transition: border .2s; box-shadow: var(--shadow); }
    .search-box:focus-within { border-color: var(--secondary); }
    .search-box i { color: #95A5A6; margin-right: 8px; font-size: 14px; }
    .search-box input { border: none; background: transparent; font-family: var(--font-main); font-size: 14px; padding: 10px 0; outline: none; width: 100%; }
    .status-filter { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 14px; border-radius: 20px; border: 2px solid #E8ECF0; background: #fff; cursor: pointer; font-family: var(--font-main); font-size: 13px; color: #7F8C8D; transition: all .2s; }
    .filter-btn:hover { border-color: var(--secondary); color: var(--secondary); }
    .filter-btn.active { font-weight: 600; }
    .filter-btn[data-status=""].active { border-color: var(--primary); color: var(--primary); background: var(--light-blue); }
    .filter-btn[data-status="DRAFT"].active { border-color: #95A5A6; color: #7F8C8D; background: #F2F3F4; }
    .filter-btn[data-status="PENDING"].active { border-color: #F39C12; color: #E67E22; background: #FEF9E7; }
    .filter-btn[data-status="PUBLISHED"].active { border-color: #148F77; color: #148F77; background: #E8F8F5; }
    .filter-btn[data-status="REJECTED"].active { border-color: #E74C3C; color: #C0392B; background: #FDEDEC; }

    /* TABLE */
    .table-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .table-header { padding: 16px 20px; border-bottom: 1px solid #F0F3F4; display: flex; align-items: center; justify-content: space-between; }
    .table-count { font-size: 13px; color: #7F8C8D; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #F8FAFB; padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600; color: #7F8C8D; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #E8ECF0; }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #F5F7F8; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FAFBFC; }

    /* Status badge */
    .status-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
    .status-DRAFT { background: #F2F3F4; color: #7F8C8D; }
    .status-PENDING { background: #FEF9E7; color: #E67E22; }
    .status-PUBLISHED { background: #E8F8F5; color: #148F77; }
    .status-REJECTED { background: #FDEDEC; color: #C0392B; }

    .inno-title-link { font-weight: 600; color: var(--primary); cursor: pointer; text-decoration: none; }
    .inno-title-link:hover { text-decoration: underline; }
    .type-chip { background: var(--light-blue); color: var(--primary); border-radius: 6px; padding: 3px 8px; font-size: 11px; }
    .dept-text { font-size: 12px; color: #7F8C8D; }
    .action-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-icon { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #E0E0E0; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #7F8C8D; font-size: 13px; transition: all .2s; text-decoration: none; }
    .btn-icon:hover.view { background: var(--secondary); color: #fff; border-color: var(--secondary); }
    .btn-icon:hover.edit { background: #F39C12; color: #fff; border-color: #F39C12; }
    .btn-icon:hover.delete { background: #E74C3C; color: #fff; border-color: #E74C3C; }
    .btn-icon:hover.submit { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Reject reason */
    .reject-reason { background: #FDEDEC; border-left: 3px solid #E74C3C; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #C0392B; margin-top: 4px; }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 24px; color: #BDC3C7; }
    .empty-state i { font-size: 48px; margin-bottom: 16px; display: block; }
    .empty-state p { font-size: 15px; color: #7F8C8D; }

    /* Delete Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; padding: 32px; max-width: 420px; width: 90%; text-align: center; }
    .modal-icon { font-size: 48px; margin-bottom: 16px; }
    .modal-title { font-family: var(--font-heading); font-size: 18px; font-weight: 700; color: #1A252F; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: #7F8C8D; margin-bottom: 24px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-cancel { background: #fff; border: 2px solid #E0E0E0; color: #7F8C8D; border-radius: 10px; padding: 10px 24px; font-family: var(--font-main); font-size: 14px; cursor: pointer; transition: all .2s; }
    .btn-cancel:hover { border-color: #BDC3C7; }
    .btn-danger { background: #E74C3C; color: #fff; border: none; border-radius: 10px; padding: 10px 24px; font-family: var(--font-main); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; }
    .btn-danger:hover { background: #C0392B; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2C3E50; color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 2000; display: none; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .toast.show { display: flex; }
    .toast.success { background: var(--accent); }
    .toast.error { background: #E74C3C; }

    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .main { padding: 16px; }
      table th:nth-child(3), table td:nth-child(3),
      table th:nth-child(4), table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a href="?page=index" class="logo">
      <div class="logo-icon"><i class="fas fa-lightbulb"></i></div>
      <div>
        <div class="logo-text">KIMS</div>
        <div class="logo-sub">กระแชงวิทยา</div>
      </div>
    </a>
    <div class="nav-auth">
      <div class="user-badge" id="userBadge"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>
      <a href="?page=upload" class="btn-sm"><i class="fas fa-plus"></i> เพิ่มนวัตกรรม</a>
      <button class="btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>
</header>

<!-- MAIN -->
<div class="main">
  <!-- Page Top -->
  <div class="page-top">
    <div>
      <div class="page-title">นวัตกรรมของฉัน <span id="totalCount"></span></div>
    </div>
    <a href="?page=upload" class="btn-upload"><i class="fas fa-plus"></i>เพิ่มนวัตกรรมใหม่</a>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-icon" style="background:#F2F3F4;color:#7F8C8D"><i class="fas fa-file-alt"></i></div>
      <div class="stat-info">
        <div class="stat-num" id="statDraft">-</div>
        <div class="stat-lbl">ร่าง</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#FEF9E7;color:#E67E22"><i class="fas fa-clock"></i></div>
      <div class="stat-info">
        <div class="stat-num" id="statPending">-</div>
        <div class="stat-lbl">รออนุมัติ</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#E8F8F5;color:#148F77"><i class="fas fa-check-circle"></i></div>
      <div class="stat-info">
        <div class="stat-num" id="statPublished">-</div>
        <div class="stat-lbl">เผยแพร่แล้ว</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#FDEDEC;color:#E74C3C"><i class="fas fa-times-circle"></i></div>
      <div class="stat-info">
        <div class="stat-num" id="statRejected">-</div>
        <div class="stat-lbl">ถูกปฏิเสธ</div>
      </div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-row">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อนวัตกรรม..." oninput="filterList()">
    </div>
    <div class="status-filter">
      <button class="filter-btn active" data-status="" onclick="setStatusFilter('')">ทั้งหมด</button>
      <button class="filter-btn" data-status="DRAFT" onclick="setStatusFilter('DRAFT')">ร่าง</button>
      <button class="filter-btn" data-status="PENDING" onclick="setStatusFilter('PENDING')">รออนุมัติ</button>
      <button class="filter-btn" data-status="PUBLISHED" onclick="setStatusFilter('PUBLISHED')">เผยแพร่</button>
      <button class="filter-btn" data-status="REJECTED" onclick="setStatusFilter('REJECTED')">ถูกปฏิเสธ</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header">
      <div class="table-count" id="tableCount">กำลังโหลด...</div>
    </div>
    <div id="tableWrapper">
      <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>กำลังโหลดข้อมูล...</p></div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <div class="modal-icon">🗑️</div>
    <div class="modal-title">ยืนยันการลบ</div>
    <div class="modal-desc" id="deleteDesc">คุณต้องการลบนวัตกรรมนี้หรือไม่? การดำเนินการนี้ไม่สามารถย้อนกลับได้</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDeleteModal()">ยกเลิก</button>
      <button class="btn-danger" onclick="confirmDelete()"><i class="fas fa-trash"></i> ลบ</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── EXEC_URL ถูก inject โดย Code.gs ตอน serve ──────────
  var EXEC_URL = "";  // placeholder — Code.gs จะแทนค่าจริง

  function getExecUrl() { return EXEC_URL || window.location.href.split('?')[0]; }
  function goTo(page) {
    var token = sessionStorage.getItem('KIMS_TOKEN') || '';
    var url = getExecUrl() + '?page=' + page;
    if (token) url += '&_kt=' + encodeURIComponent(token);
    window.open(url, '_top');
  }
  (function() {
    try { var p = new URLSearchParams(window.location.search); var t = p.get('_kt'); if (t) { sessionStorage.setItem('KIMS_TOKEN', t); p.delete('_kt'); if (history.replaceState) history.replaceState(null, '', '?' + p.toString()); } } catch(e) {}
    document.addEventListener('click', function(ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href*="?page="]') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      var i = href.indexOf('?page='); if (i === -1) return;
      ev.preventDefault();
      var tok = sessionStorage.getItem('KIMS_TOKEN') || '';
      var url = getExecUrl() + href.substring(i);
      if (tok && url.indexOf('_kt=') === -1) url += '&_kt=' + encodeURIComponent(tok);
      window.open(url, a.getAttribute('target') === '_blank' ? '_blank' : '_top');
    });
  })();
  function getToken() { return sessionStorage.getItem('KIMS_TOKEN') || ''; }

  function callAPI(action, params) {
    var payload = Object.assign({ action: action, token: getToken() }, params || {});
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .handleRequest(payload);
    });
  }

const TYPE_ICONS = {'01':'🖥️','02':'🔬','03':'📋','04':'📝','05':'⚙️','99':'💡'};
const TYPE_NAMES = {'01':'สื่อ/CAI','02':'วิจัย','03':'แผนการสอน','04':'ชุดกิจกรรม','05':'เทคโนโลยี','99':'อื่นๆ'};
const STATUS_LABEL = {DRAFT:'ร่าง',PENDING:'รออนุมัติ',PUBLISHED:'เผยแพร่แล้ว',REJECTED:'ถูกปฏิเสธ'};
const STATUS_ICON = {DRAFT:'fas fa-file-alt',PENDING:'fas fa-clock',PUBLISHED:'fas fa-check-circle',REJECTED:'fas fa-times-circle'};

let allItems = [];
let currentStatus = '';
let deleteTargetId = '';


window.addEventListener('DOMContentLoaded', async () => {
  try {
    const userRes = await callAPI('getCurrentUser', {});
    if (!userRes.success) { sessionStorage.removeItem('KIMS_TOKEN'); sessionStorage.removeItem('KIMS_USER'); goTo('login'); return; }
    const u = userRes.data;
    document.getElementById('userBadge').innerHTML = `<i class="fas fa-user-circle"></i> ${escHtml(u.full_name)}`;
    await loadMyInnovations();
  } catch(e) {
    sessionStorage.removeItem('KIMS_TOKEN'); sessionStorage.removeItem('KIMS_USER'); goTo('login');
  }
});

async function loadMyInnovations() {
  try {
    const res = await callAPI('getMyInnovations', {});
    if (!res.success) { showToast(res.error || 'เกิดข้อผิดพลาด', 'error'); return; }
    allItems = res.data || [];
    updateStats();
    renderTable();
  } catch(e) {
    showToast('เกิดข้อผิดพลาดในการโหลดข้อมูล', 'error');
  }
}

function updateStats() {
  const counts = { DRAFT: 0, PENDING: 0, PUBLISHED: 0, REJECTED: 0 };
  allItems.forEach(i => { if (counts[i.status] !== undefined) counts[i.status]++; });
  document.getElementById('statDraft').textContent = counts.DRAFT;
  document.getElementById('statPending').textContent = counts.PENDING;
  document.getElementById('statPublished').textContent = counts.PUBLISHED;
  document.getElementById('statRejected').textContent = counts.REJECTED;
  document.getElementById('totalCount').textContent = `(${allItems.length} รายการ)`;
}

function filterList() {
  renderTable();
}

function setStatusFilter(status) {
  currentStatus = status;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.status === status);
  });
  renderTable();
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allItems.filter(i => {
    const matchStatus = !currentStatus || i.status === currentStatus;
    const matchSearch = !search || i.title.toLowerCase().includes(search) || (i.department||'').toLowerCase().includes(search);
    return matchStatus && matchSearch;
  });

  document.getElementById('tableCount').textContent = `แสดง ${filtered.length} รายการ`;

  if (filtered.length === 0) {
    document.getElementById('tableWrapper').innerHTML = `<div class="empty-state">
      <i class="fas fa-inbox"></i>
      <p>${currentStatus || search ? 'ไม่พบรายการที่ตรงกับเงื่อนไข' : 'คุณยังไม่มีนวัตกรรมในระบบ'}</p>
      ${!currentStatus && !search ? `<a href="?page=upload" style="display:inline-block;margin-top:14px;background:var(--accent);color:#fff;padding:10px 22px;border-radius:10px;text-decoration:none;font-weight:600"><i class="fas fa-plus"></i> เพิ่มนวัตกรรมแรกของคุณ</a>` : ''}
    </div>`;
    return;
  }

  const rows = filtered.map(item => {
    const icon = TYPE_ICONS[item.type_code] || '💡';
    const typeName = TYPE_NAMES[item.type_code] || '-';
    const canEdit = ['DRAFT','REJECTED'].includes(item.status);
    const canDelete = ['DRAFT','REJECTED'].includes(item.status);
    const canSubmit = item.status === 'DRAFT';
    return `<tr>
      <td>
        <div style="display:flex;align-items:flex-start;gap:10px">
          <span style="font-size:20px;flex-shrink:0;margin-top:2px">${icon}</span>
          <div>
            <a class="inno-title-link" onclick="viewDetail('${escHtml(item.innovation_id)}')">${escHtml(item.title)}</a>
            <div class="dept-text" style="margin-top:3px">${escHtml(item.department||'-')}</div>
            ${item.status === 'REJECTED' && item.reject_reason ? `<div class="reject-reason"><i class="fas fa-info-circle"></i> ${escHtml(item.reject_reason)}</div>` : ''}
          </div>
        </div>
      </td>
      <td>
        <span class="status-badge status-${item.status}">
          <i class="${STATUS_ICON[item.status]||'fas fa-circle'}" style="font-size:10px"></i>
          ${STATUS_LABEL[item.status]||item.status}
        </span>
      </td>
      <td><span class="type-chip">${typeName}</span></td>
      <td style="color:#7F8C8D;font-size:13px">${escHtml(String(item.academic_year||'-'))}</td>
      <td style="color:#7F8C8D;font-size:13px">${escHtml(item.updated_at ? item.updated_at.split(' ')[0] : '-')}</td>
      <td>
        <div class="action-btns">
          <button class="btn-icon view" onclick="viewDetail('${escHtml(item.innovation_id)}')" title="ดูรายละเอียด"><i class="fas fa-eye"></i></button>
          ${canEdit ? `<button class="btn-icon edit" onclick="editItem('${escHtml(item.innovation_id)}')" title="แก้ไข"><i class="fas fa-edit"></i></button>` : ''}
          ${canSubmit ? `<button class="btn-icon submit" onclick="submitItem('${escHtml(item.innovation_id)}', '${escHtml(item.title)}')" title="ส่งขออนุมัติ"><i class="fas fa-paper-plane"></i></button>` : ''}
          ${canDelete ? `<button class="btn-icon delete" onclick="deleteItem('${escHtml(item.innovation_id)}', '${escHtml(item.title)}')" title="ลบ"><i class="fas fa-trash"></i></button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('tableWrapper').innerHTML = `<div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>นวัตกรรม</th>
          <th>สถานะ</th>
          <th>ประเภท</th>
          <th>ปีการศึกษา</th>
          <th>อัปเดต</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function viewDetail(id) {
  goTo('detail&id=') + id;
}

function editItem(id) {
  goTo('upload&edit=') + id;
}

let deleteTargetName = '';
function deleteItem(id, name) {
  deleteTargetId = id;
  deleteTargetName = name;
  document.getElementById('deleteDesc').textContent = `ต้องการลบ "${name}" หรือไม่? ไฟล์แนบทั้งหมดจะถูกลบออกจากระบบ`;
  document.getElementById('deleteModal').classList.add('show');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('show');
  deleteTargetId = '';
}

async function confirmDelete() {
  closeDeleteModal();
  try {
    const res = await callAPI('deleteInnovation', { innovation_id: deleteTargetId });
    if (res.success) {
      showToast('ลบนวัตกรรมสำเร็จ', 'success');
      await loadMyInnovations();
    } else {
      showToast(res.error || 'ไม่สามารถลบได้', 'error');
    }
  } catch(e) {
    showToast('เกิดข้อผิดพลาด', 'error');
  }
}

async function submitItem(id, name) {
  if (!confirm(`ต้องการส่ง "${name}" เพื่อขออนุมัติหรือไม่?`)) return;
  try {
    const item = allItems.find(i => i.innovation_id === id);
    if (!item) return;
    const res = await callAPI('updateInnovation', { ...item, innovation_id: id, status: 'PENDING' });
    if (res.success) {
      showToast('ส่งขออนุมัติสำเร็จ', 'success');
      await loadMyInnovations();
    } else {
      showToast(res.error || 'ไม่สามารถส่งได้', 'error');
    }
  } catch(e) {
    showToast('เกิดข้อผิดพลาด', 'error');
  }
}

async function logout() {
  await callAPI('logout', {});
  sessionStorage.removeItem('KIMS_TOKEN'); sessionStorage.removeItem('KIMS_USER'); goTo('login');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type || ''}`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
